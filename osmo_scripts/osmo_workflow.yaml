workflow:
  name: {{ workflow_name }}
  resources:
    default:
      cpu: {{ num_cpu }}
      gpu: {{ num_gpu }}
      memory: {{ memory }}
      storage: {{ storage }}
      platform: {{ resource_platform }}

  tasks:
  - name: virtual-node
    image: {{ image }}
    environment:
      ACCEPT_EULA: "Y"
      OMNI_KIT_ALLOW_ROOT: "1"
      PRIVACY_CONSENT: "Y"
      DISABLE_RUST_CLIENT: "{{ disable_rust_client }}"
      WORKFLOW_ID: "{{workflow_id}}"
      OUTPUT_LOCAL_PATH: /tmp/runs/output
      PROJECT_ROOT: /root/code/IsaacLab-NeRD
      OSMO_EXPERIMENT_PRESET: "{{ osmo_experiment_preset }}"
      WORKFLOW_BASE_NAME: "{{ workflow_base_name }}"
      DATASET_SUBDIR: "{{ dataset_subdir }}"
      DATASET_CACHE_MODE: "{{ dataset_cache_mode }}"
      AMLFS_DATA_ROOT: "{{ amlfs_data_root }}"
      TRAIN_SEED: "{{ train_seed }}"
      STORAGE_BACKEND: "{{ storage_backend }}"
      OSMO_CODE_DIR: /osmo/data/input/0
      OSMO_DATA_DIR: /osmo/data/input/1
      OSMO_DATASET_UPLOAD_URL: "{{ osmo_dataset_upload_url }}"
      OSMO_OUTPUT_URL: "{{ osmo_output_url }}"
      SWIFT_CODE_DIR: /tmp/swift/code
      SWIFT_CODE_CONTAINER: "{{ swift_code_container }}"
      SWIFT_CODE_OBJECT: "{{ swift_code_object }}"
      SWIFT_DATA_DIR: /tmp/swift/data
      SWIFT_DATA_CONTAINER: "{{ swift_data_container }}"
      SWIFT_OUTPUT_CONTAINER: "{{ swift_output_container }}"
      SWIFT_OUTPUT_PREFIX: "{{ workflow_name }}"
      NVDATASET_CODE_DIR: /tmp/nvdatasets/code
      NVDATASET_CODE_DATASET: "{{ nvdataset_code_dataset }}"
      NVDATASET_CODE_SNAPSHOT: "{{ nvdataset_code_snapshot }}"
      NVDATASET_DATA_DIR: /tmp/nvdatasets/data
      NVDATASET_DATA_DATASET: "{{ nvdataset_data_dataset }}"
      NVDATASET_DATA_SNAPSHOT: "{{ nvdataset_data_snapshot }}"
      NVDATASET_DATA_DESCRIPTION: "{{ nvdataset_data_description }}"
      NVDATASET_OUTPUT_DATASET: "{{ nvdataset_output_dataset }}"
      NVDATASET_OUTPUT_DESCRIPTION: "{{ nvdataset_output_description }}"
      NVDATASET_OUTPUT_DIR: "{{ workflow_name }}"
      NVDATASET_INDEX_URL: "{{ nvdataset_index_url }}"
      ENABLE_WANDB: "{{ enable_wandb }}"
      WANDB_PROJECT_NAME: "{{ wandb_project_name }}"
      WANDB_EXP_NAME: "{{ wandb_exp_name }}"
      WANDB_ENTITY: "{{ wandb_entity }}"
    command:
    - /bin/bash
    args:
    - /tmp/entrypoint.sh
{% if storage_backend != "osmo_data" or enable_wandb == "true" %}
    credentials:
{% if storage_backend != "osmo_data" %}
      {{ storage_credential }}:
        {{ storage_auth_url_env }}: {{ storage_auth_url_key }}
        {{ storage_auth_version_env }}: {{ storage_auth_version_key }}
        {{ storage_user_env }}: {{ storage_user_key }}
        {{ storage_key_env }}: {{ storage_key_key }}
        {{ storage_tenant_env }}: {{ storage_tenant_key }}
{% endif %}
{% if enable_wandb == "true" %}
      {{ wandb_credential }}:
        WANDB_API_KEY: wandb_api_key
{% endif %}
{% endif %}
{% if storage_backend == "osmo_data" %}
    inputs:
    - url: {{ osmo_code_url }}
{% if osmo_dataset_input_url %}
    - url: {{ osmo_dataset_input_url }}
{% endif %}
{% endif %}
    files:
    - path: /tmp/init.sh
      localpath: {{ init_sh_localpath }}
    - path: /tmp/entrypoint.sh
      localpath: {{ entrypoint_localpath }}
    - path: /tmp/nvdataset_io.py
      localpath: {{ nvdataset_io_localpath }}
    - path: /tmp/swift_io.py
      localpath: {{ swift_io_localpath }}

default-values:
  workflow_name: anymal-c-fixed-ground
  workflow_base_name: anymal-c-fixed-ground
  osmo_experiment_preset: anymal_fixed_ground
  image: nvcr.io/nvidia/isaac-lab:3.0.0-beta2
  num_cpu: 15
  num_gpu: 1
  memory: 64Gi
  storage: 256Gi
  resource_platform: ovx-l40s
  dataset_subdir: anymal-c-fixed-ground
  dataset_cache_mode: auto
  amlfs_data_root: ""
  train_seed: "0"
  storage_backend: nvdataset
  osmo_code_url: ""
  osmo_dataset_input_url: ""
  osmo_dataset_upload_url: ""
  osmo_output_url: ""
  storage_credential: nvdataset_cred
  storage_auth_url_env: STORAGE_UNUSED_AUTH_URL
  storage_auth_url_key: tenant_id
  storage_auth_version_env: STORAGE_UNUSED_AUTH_VERSION
  storage_auth_version_key: tenant_id
  storage_user_env: STORAGE_UNUSED_USER
  storage_user_key: tenant_id
  storage_key_env: NGC_API_KEY
  storage_key_key: nvapi_key
  storage_tenant_env: NVDATASET_TENANTID
  storage_tenant_key: tenant_id
  disable_rust_client: "1"
  swift_code_container: isaaclab-nerd-code
  swift_code_object: IsaacLab-NeRD.tar.gz
  swift_data_container: isaaclab-nerd-datasets
  swift_output_container: isaaclab-nerd-output
  nvdataset_credential: nvdataset_cred
  nvdataset_code_dataset: IsaacLab-NeRD-Code
  nvdataset_code_snapshot: ""
  nvdataset_data_dataset: IsaacLab-NeRD-Datasets
  nvdataset_data_snapshot: ""
  nvdataset_data_description: IsaacLab-NeRD generated HDF5 datasets.
  nvdataset_output_dataset: IsaacLab-NeRD-Output
  nvdataset_output_description: IsaacLab-NeRD OSMO training outputs.
  nvdataset_index_url: https://artifactory.pdx.nvidia.com/artifactory/api/pypi/sw-ngc-data-platform-pypi-local/simple
  enable_wandb: "false"
  wandb_credential: wandb
  wandb_project_name: nerd-newton
  wandb_exp_name: ""
  wandb_entity: ""
  init_sh_localpath: ./init.sh
  entrypoint_localpath: ./entrypoint.sh
  nvdataset_io_localpath: ./lib/nvdataset_io.py
  swift_io_localpath: ./lib/swift_io.py
