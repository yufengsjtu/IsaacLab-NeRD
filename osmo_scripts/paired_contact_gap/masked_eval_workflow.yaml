workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      cpu: 12
      gpu: 1
      memory: 96Gi
      storage: 64Gi
      platform: ovx-l40

  tasks:
  - name: evaluate-c-without-self-collisions
    image: nvcr.io/nvidia/isaac-lab:3.0.0-beta2
    environment:
      ACCEPT_EULA: "Y"
      OMNI_KIT_ALLOW_ROOT: "1"
      PRIVACY_CONSENT: "Y"
      MASKED_EVAL_CODE_DIR: /osmo/data/input/0
      MASKED_EVAL_DATASET_DIR: /osmo/data/input/1
      MASKED_EVAL_MANIFEST_DIR: /osmo/data/input/2
      MASKED_EVAL_CHECKPOINT_DIR: /osmo/data/input/3
      MASKED_EVAL_OUTPUT_PARENT_URL: "{{ output_parent_url }}"
      MASKED_EVAL_ARTIFACT_NAME: "{{ artifact_name }}"
    command:
    - /bin/bash
    args:
    - /tmp/masked-eval-entrypoint.sh
    inputs:
    - url: "{{ code_url }}"
    - url: "{{ dataset_url }}"
    - url: "{{ manifest_url }}"
    - url: "{{ checkpoint_url }}"
    files:
    - path: /tmp/masked-eval-entrypoint.sh
      localpath: "{{ entrypoint_localpath }}"

default-values:
  workflow_name: rowan-cgap-c-mask-self
  code_url: ""
  dataset_url: ""
  manifest_url: ""
  checkpoint_url: ""
  output_parent_url: ""
  artifact_name: c-active-mask-self
  entrypoint_localpath: ./masked_eval_entrypoint.sh
