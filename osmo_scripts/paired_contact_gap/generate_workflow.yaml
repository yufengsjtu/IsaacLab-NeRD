workflow:
  name: "{{ workflow_name }}"
  resources:
    default:
      cpu: 12
      gpu: 1
      memory: 96Gi
      storage: 64Gi
      platform: ovx-l40

  tasks:
  - name: generate-paired-dataset
    image: nvcr.io/nvidia/isaac-lab:3.0.0-beta2
    environment:
      ACCEPT_EULA: "Y"
      OMNI_KIT_ALLOW_ROOT: "1"
      PRIVACY_CONSENT: "Y"
      PAIRED_EVAL_MODE: generate
      PAIRED_EVAL_CODE_DIR: /osmo/data/input/0
      PAIRED_EVAL_OUTPUT_PARENT_URL: "{{ output_parent_url }}"
      PAIRED_EVAL_ARTIFACT_NAME: "{{ artifact_name }}"
    command:
    - /bin/bash
    args:
    - /tmp/paired-eval-entrypoint.sh
    inputs:
    - url: "{{ code_url }}"
    files:
    - path: /tmp/paired-eval-entrypoint.sh
      localpath: "{{ entrypoint_localpath }}"

default-values:
  workflow_name: rowan-cgap-paired-policy-eval
  code_url: ""
  output_parent_url: ""
  artifact_name: paired-policy-eval
  entrypoint_localpath: ./entrypoint.sh
