campaign:
  name: c-active-mechanism-ablation
  dataset_subdirs:
    raw15: anymal-c-rough-newton-native-raw15-sampling-v2-20260821-0630
    contact_tokens: anymal-c-rough-newton-native-contact-tokens-sampling-v2-20260821-0630
  dataset_cache_mode: require
  storage_backend: osmo_data
  priority: NORMAL
  wandb_entity: nvr-srl
  wandb_project: isaaclab-nerd-rowan-contact-ablation
  resources:
    num_gpu: 8
    num_cpu: 96
    memory: 512Gi
    storage: 512Gi
    platform: ovx-l40
  training:
    num_epochs: 1000
    num_iters_per_epoch: 5000
    save_interval: 100
    persist_periodic_checkpoints: true
    early_stop_checkpoint_gate: verify_wandb_file_download

rows:
  - id: A-ACTIVE-MEAN
    preset: anymal_rough_newton_native_active15_mean
    dataset_family: raw15
    seeds: [0, 1, 2]
  - id: A-ACTIVE-SUM-COUNT
    preset: anymal_rough_newton_native_active15_sum_count
    dataset_family: raw15
    seeds: [0, 1, 2]
  - id: A-ACTIVE-MEAN-COUNT
    preset: anymal_rough_newton_native_active15_mean_count
    dataset_family: raw15
    seeds: [0, 1, 2]
  - id: C-ACTIVE-NO-OTHER-EMBEDDING
    preset: anymal_rough_newton_native_shared_per_body_active_filter_no_other_embedding
    dataset_family: contact_tokens
    seeds: [0, 1, 2]
