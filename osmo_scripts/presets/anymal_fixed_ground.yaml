workflow:
  base_name: anymal-c-fixed-ground
  dataset_subdir: anymal-c-fixed-ground

resources:
  num_gpu: 8
  num_cpu: 96
  memory: 512Gi
  storage: 512Gi
  platform: ovx-l40s

experiment:
  env_name: Anymal-C
  robot_name: Anymal-C
  data_gen_task: Isaac-Velocity-Flat-Anymal-C-Dataset-Gen-v0
  deployment_task: Isaac-Velocity-Flat-Anymal-C-v0
  train_task: Isaac-Velocity-Flat-Anymal-C-NeRD-v0
  train_cfg: ./source/isaaclab_neural/isaaclab_neural/train/cfg/Anymal/transformer.yaml
  train_preset: newton_mjwarp
  num_gpus: 8
  contact_mode: fixed_ground
  sample_mode: action
  initial_states_source: env
  randomize_pd_gains: true
  train_transitions: 20000000
  valid_transitions: 1000000
  data_gen_num_envs: 1024
  train_num_envs: 1024
  trajectory_length: 400
  write_chunk_transitions: 10000000
  policy_checkpoint: /home/rowany/workspace/neural-robot-simulation-isaaclab/logs/rsl_rl/Anymal-C/gt/2026-06-10_13-47-40/model_499.pt
  dataset_specs:
    - filename: dataset_train.hdf5
      seed: 0
      split: train
      task_kind: default
      zero_actions: false
      use_policy: false
    - filename: dataset_valid.hdf5
      seed: 10
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: false
    - filename: dataset_zero_action_valid.hdf5
      seed: 20
      split: valid
      task_kind: default
      zero_actions: true
      use_policy: false
    - filename: dataset_lstm_actuator_zero_action_valid.hdf5
      seed: 30
      split: valid
      task_kind: deployment
      zero_actions: true
      use_policy: false
    - filename: dataset_lstm_actuator_policy_valid.hdf5
      seed: 40
      split: valid
      task_kind: deployment
      zero_actions: false
      use_policy: true
