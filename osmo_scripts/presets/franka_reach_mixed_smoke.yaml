# Smoke variant of franka_reach_mixed: same recipe, tiny counts, one GPU.
# Mixed Franka Reach dynamics data: multi-timescale random walk, random
# actions through the RL action contract, noisy policy rollouts and clean
# policy rollouts. Weighted training is configured in the training YAML.
workflow:
  base_name: franka-reach-mixed-smoke
  dataset_subdir: franka-reach-legacy-60hz-mixed-smoke
  image: docker.io/rowany28070/isaac-lab-nerd:g1-develop

resources:
  num_gpu: 1
  num_cpu: 12
  memory: 64Gi
  storage: 64Gi
  platform: ovx-l40s

experiment:
  dataset_dir: ./data/datasets/legacy-60hz
  env_name: Franka-Reach
  robot_name: Franka
  data_gen_task: Isaac-Reach-Franka-Dataset-Gen-v0
  deployment_task: Isaac-Reach-Franka-Dataset-Gen-v0
  train_task: Isaac-Reach-Franka-NeRD-v0
  train_cfg: ./source/isaaclab_neural/isaaclab_neural/train/cfg/Franka/transformer_reach_mixed.yaml
  train_preset: newton_mjwarp
  num_gpus: 1
  contact_mode: newton_native
  contact_representation: flat
  num_contacts_per_env: 0
  sample_mode: action
  initial_states_source: env
  action_hold_frames: [2, 5, 10, 20, 40]
  states_frame: world
  train_transitions: 3200
  valid_transitions: 240
  data_gen_num_envs: 16
  train_num_envs: 16
  trajectory_length: 240
  write_chunk_transitions: 3200
  update_dataset_statistics: true
  policy_checkpoint: ./pretrained/control_policy/franka_reach/model_999.pt
  dataset_specs:
    - filename: dataset_random_train.hdf5
      seed: 0
      split: train
      task_kind: default
      zero_actions: false
      use_policy: false
      num_transitions: 960
    - filename: dataset_rl_contract_train.hdf5
      seed: 10
      split: train
      task_kind: default
      zero_actions: false
      use_policy: false
      rl_action_contract: true
      action_hold_frames: [2, 5, 10, 20]
      num_transitions: 720
    - filename: dataset_policy_noisy_train.hdf5
      seed: 20
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      policy_action_noise_std: 0.3
      num_transitions: 720
    - filename: dataset_policy_train.hdf5
      seed: 30
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      num_transitions: 720
    - filename: dataset_valid.hdf5
      seed: 1
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: false
    - filename: dataset_passive_valid.hdf5
      seed: 2
      split: valid
      task_kind: default
      zero_actions: true
      use_policy: false
    - filename: dataset_policy_valid.hdf5
      seed: 3
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
    - filename: dataset_policy_noisy_valid.hdf5
      seed: 4
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
      policy_action_noise_std: 0.3
