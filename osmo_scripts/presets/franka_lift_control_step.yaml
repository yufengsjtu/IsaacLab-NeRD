# SO101/Allegro-style control-step NeRD for Franka cube lift with the official Newton MJWarp policy: the
# env-driven collector records reset-safe 32-control-step clips (with finger-object normal-force labels) on eight
# GPUs; training uses unique-transition sliding windows, GPU-resident data, FP16 autocast and closed-loop lifting
# evaluation selected against the native success rate, followed by the throughput benchmarks.

workflow:
  base_name: franka-lift-control-step
  dataset_subdir: franka-lift-control-step-v1
  image: docker.io/rowany28070/isaac-lab-nerd:so101-newton160-cu130-sdk095

resources:
  num_gpu: 8
  num_cpu: 80
  memory: 512Gi
  storage: 512Gi
  platform: ovx-l40s

experiment:
  dataset_dir: ./data/datasets/franka-lift-control-step-v1
  env_name: Franka-Lift-ControlStep
  robot_name: Franka-Lift
  data_gen_task: Isaac-Lift-Cube-Franka-Dataset-Gen-v0
  deployment_task: Isaac-Lift-Cube-Franka-Dataset-Gen-v0
  # Graph-enabled twin of the recording task: teacher runner config, native evaluation and baselines.
  policy_task: Isaac-Lift-Cube-Franka-Policy-v0
  train_task: Isaac-Lift-Cube-Franka-NeRD-v0
  train_cfg: ./source/isaaclab_neural/isaaclab_neural/train/cfg/Franka/transformer_lift_control_step.yaml
  train_preset: newton_mjwarp
  num_gpus: 8
  contact_mode: newton_native
  contact_representation: contact_tokens
  num_contacts_per_env: 64
  max_contact_tokens: 64
  contact_packing_policy: body_round_robin_pair_atomic
  contact_filter: solver_active_movable
  dataset_collector: env_driven
  record_control_steps: true
  collection_chunk_control_steps: 64
  sample_mode: action
  initial_states_source: env
  states_frame: body
  train_transitions: 6000000
  valid_transitions: 333334
  data_gen_num_envs: 1024
  train_num_envs: 256
  # Clips of 32 control steps.
  trajectory_length: 32
  # Dataset shards collected concurrently, one GPU each.
  parallel_collection_gpus: 8
  no_time_stamp: true
  headless: true
  update_dataset_statistics: true
  eval_interval: 5
  policy_checkpoint: ./pretrained/official/Isaac-Lift-Franka_newtonmjwarp_none_rsl_rl.pt
  require_packaged_policy: true
  policy_evaluation:
    module: isaaclab_neural.eval.policy_rollout
    num_envs: 256
    control_steps: 1000
    seed: 100
    args: [--task, Isaac-Lift-Cube-Franka-Policy-v0, --metric, pose_success_rate]
    min_metrics:
      pose_success_rate: 0.02
    # The native metric becomes the closed-loop checkpoint-selection reference during training.
    reference:
      metric: pose_success_rate
      cfg_key: algorithm.eval.selection.reference
  throughput_benchmark:
    module: isaaclab_neural.eval.task_benchmark
    checkpoint_name: best_eval_model.pt
    num_envs: [1024, 8192]
    model_autocast: [fp32, fp16]
    # Primary-body count is approximate; it only sizes the synthetic contact inputs of the model-only timing.
    model_args: [--num-bodies, 12, --frames-per-control-step, 4]
    env_args: [--task, Isaac-Lift-Cube-Franka-Policy-v0, --nerd-task, Isaac-Lift-Cube-Franka-NeRD-v0]
    variants:
      - name: mjwarp_newton_contacts
      # reset_history episode_start requires the frame cache, so the baseline keeps it.
      - name: nerd_fp32_eager
        nerd: true
        args: [--inference-precision, fp32, --no-inference-compile]
      - name: nerd_optimized
        nerd: true
  dataset_specs:
    - filename: dataset_policy_a_train.hdf5
      seed: 0
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      num_transitions: 1200000
    - filename: dataset_policy_b_train.hdf5
      seed: 30
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      num_transitions: 1200000
    - filename: dataset_policy_c_train.hdf5
      seed: 40
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      num_transitions: 1200000
    - filename: dataset_policy_noisy_train.hdf5
      seed: 10
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      policy_action_noise_std: 0.1
      num_transitions: 1200000
    - filename: dataset_zero_action_train.hdf5
      seed: 20
      split: train
      task_kind: default
      zero_actions: true
      use_policy: false
      num_transitions: 1200000
    - filename: dataset_policy_valid.hdf5
      seed: 1
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
    - filename: dataset_policy_noisy_valid.hdf5
      seed: 3
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
      policy_action_noise_std: 0.1
    - filename: dataset_zero_action_valid.hdf5
      seed: 2
      split: valid
      task_kind: default
      zero_actions: true
      use_policy: false
