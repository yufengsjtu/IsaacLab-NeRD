workflow:
  base_name: anymal-rough-context-diagnostic
  dataset_subdir: anymal-rough-context-diagnostic

resources:
  num_gpu: 1
  num_cpu: 15
  memory: 64Gi
  storage: 64Gi
  platform: ovx-l40s

experiment:
  env_name: Anymal-C-Rough-Native
  robot_name: Anymal-C
  data_gen_task: Isaac-Velocity-Rough-Anymal-C-Dataset-Gen-v0
  deployment_task: Isaac-Velocity-Rough-Anymal-C-v0
  train_task: Isaac-Velocity-Rough-Anymal-C-NeRD-v0
  train_cfg: ./source/isaaclab_neural/isaaclab_neural/train/cfg/Anymal/transformer_rough_native.yaml
  train_preset: newton_mjwarp
  contact_mode: newton_native
  num_contacts_per_env: 64
  contact_packing_policy: penetration_priority
  states_frame: body
  sample_mode: action
  initial_states_source: env
  train_transitions: 1280
  valid_transitions: 20480
  data_gen_num_envs: 1024
  train_num_envs: 64
  trajectory_length: 20
  write_chunk_transitions: 0
  randomize_pd_gains: false
  diagnostic_only: true
  diagnostic_dataset: dataset_context_1024env_seed40.hdf5
  diagnostic_num_envs: 64
  diagnostic_step: 9
  diagnostic_contact_tolerance: 1.0e-4
  diagnostic_negative_seed_test: true
  dataset_specs:
    - filename: dataset_context_1024env_seed40.hdf5
      seed: 40
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: false
