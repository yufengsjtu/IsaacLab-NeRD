workflow:
  base_name: g1-newton-native-shared-per-body-smoke
  dataset_subdir: g1-newton-native-contact-tokens-v3-active-smoke-mixed-ckpt1499-valid3200-stock-holdhand
  image: docker.io/rowany28070/isaac-lab-nerd:g1-develop

resources:
  num_gpu: 1
  num_cpu: 12
  memory: 64Gi
  storage: 64Gi
  platform: ovx-l40s

experiment:
  env_name: G1-Native-ContactTokens
  robot_name: G1
  data_gen_task: Isaac-Velocity-Flat-G1-Dataset-Gen-v0
  deployment_task: Isaac-Velocity-Flat-G1
  policy_checkpoint: ./pretrained/control_policy/g1_flat_terrain/model_1499.pt
  require_policy_checkpoint: true
  train_task: Isaac-Velocity-Flat-G1-NeRD-v0
  train_cfg: ./source/isaaclab_neural/isaaclab_neural/train/cfg/G1/transformer_native_smoke.yaml
  num_gpus: 1
  contact_mode: newton_native
  contact_representation: contact_tokens
  contact_filter: solver_active
  num_contacts_per_env: 64
  max_contact_tokens: 64
  contact_packing_policy: body_round_robin_pair_atomic
  sample_mode: action
  initial_states_source: env
  randomize_pd_gains: true
  kp_scale_range: [0.8, 1.2]
  kd_scale_range: [0.8, 1.2]
  train_transitions: 3200
  data_gen_num_envs: 16
  train_num_envs: 64
  trajectory_length: 100
  write_chunk_transitions: 3200
  update_dataset_statistics: true
  dataset_mix:
    ratios: [2, 0, 0, 2, 2, 4]
    perturbed_trajectory_length: 10
    perturbed_random_fraction: 1.0
    reset_trajectory_length: 100
    policy_checkpoint_dir: pretrained/control_policy/g1_flat_terrain/checkpoint_mix
    policy_checkpoint_iters: [1499]
    # 3200 fills 5 drop_last batches of 64, including perturbed clips of
    # length 10 (one sequence per clip).
    valid:
      transitions: 3200
      always: [policy, random, zero, deployment]
