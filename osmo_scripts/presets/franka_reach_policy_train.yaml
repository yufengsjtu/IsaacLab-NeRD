workflow:
  base_name: franka-reach-policy-train
  dataset_subdir: franka-reach-legacy-60hz-policy-train
  image: docker.io/rowany28070/isaac-lab-nerd:g1-develop

resources:
  num_gpu: 8
  num_cpu: 80
  memory: 512Gi
  storage: 512Gi
  platform: ovx-l40s

experiment:
  dataset_dir: ./data/datasets/legacy-60hz
  env_name: Franka-Reach
  robot_name: Franka
  data_gen_task: Isaac-Reach-Franka-Dataset-Gen-v0
  deployment_task: Isaac-Reach-Franka-Dataset-Gen-v0
  train_task: Isaac-Reach-Franka-NeRD-v0
  train_cfg: ./source/isaaclab_neural/isaaclab_neural/train/cfg/Franka/transformer_reach_policy.yaml
  train_preset: newton_mjwarp
  num_gpus: 8
  contact_mode: newton_native
  contact_representation: flat
  num_contacts_per_env: 0
  sample_mode: action
  initial_states_source: env
  action_hold_frames: 20
  states_frame: world
  train_transitions: 10000000
  valid_transitions: 1000000
  data_gen_num_envs: 1024
  train_num_envs: 64
  trajectory_length: 240
  write_chunk_transitions: 819200
  update_dataset_statistics: true
  policy_checkpoint: ./pretrained/control_policy/franka_reach/model_999.pt
  dataset_specs:
    - filename: dataset_train.hdf5
      seed: 0
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
    - filename: dataset_valid.hdf5
      seed: 1
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
    - filename: dataset_passive_valid.hdf5
      seed: 2
      split: valid
      task_kind: default
      zero_actions: true
      use_policy: false
    - filename: dataset_policy_valid.hdf5
      seed: 3
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
