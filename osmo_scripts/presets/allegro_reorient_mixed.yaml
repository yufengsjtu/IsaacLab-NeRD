# Allegro hand + free DexCube NeRD with a packaged teacher, as for SO101 Keyboard: stage
# the allegro_reorient_teacher checkpoint at policy_checkpoint before submission. The
# workflow gates it on a closed-loop MJWarp baseline, collects clean/noisy/zero-action
# data with it and trains NeRD with closed-loop reorientation evaluation.

workflow:
  base_name: allegro-reorient-mixed
  dataset_subdir: allegro-reorient-newton-contacts-v1
  image: docker.io/rowany28070/isaac-lab-nerd:so101-newton160-cu130-sdk095

resources:
  num_gpu: 8
  num_cpu: 80
  memory: 512Gi
  storage: 512Gi
  platform: ovx-l40

experiment:
  dataset_dir: ./data/datasets/allegro-reorient-newton-contacts-v1
  env_name: Allegro-Reorient
  robot_name: Allegro-Reorient
  data_gen_task: Isaac-Reorient-Cube-Allegro-Dataset-Gen-v0
  deployment_task: Isaac-Reorient-Cube-Allegro-Dataset-Gen-v0
  train_task: Isaac-Reorient-Cube-Allegro-NeRD-v0
  train_cfg: ./source/isaaclab_neural/isaaclab_neural/train/cfg/Allegro/transformer_reorient_mixed.yaml
  train_preset: newton_mjwarp
  num_gpus: 8
  contact_mode: newton_native
  contact_representation: contact_tokens
  num_contacts_per_env: 128
  max_contact_tokens: 128
  contact_packing_policy: body_round_robin_pair_atomic
  sample_mode: action
  initial_states_source: env
  states_frame: body
  train_transitions: 10000000
  valid_transitions: 1000000
  data_gen_num_envs: 1024
  train_num_envs: 256
  trajectory_length: 600
  write_chunk_transitions: 614400
  update_dataset_statistics: true
  eval_interval: 5
  policy_checkpoint: ./pretrained/control_policy/allegro_reorient/model_4999.pt
  require_packaged_policy: true
  policy_evaluation:
    module: isaaclab_neural.eval.allegro_reorient_policy
    num_envs: 256
    control_steps: 1500
    seed: 100
    min_mean_goals_per_episode: 2.0
  dataset_specs:
    - filename: dataset_policy_train.hdf5
      seed: 0
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      num_transitions: 6000000
    - filename: dataset_policy_noisy_train.hdf5
      seed: 10
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      policy_action_noise_std: 0.1
      num_transitions: 2000000
    - filename: dataset_zero_action_train.hdf5
      seed: 20
      split: train
      task_kind: default
      zero_actions: true
      use_policy: false
      num_transitions: 2000000
    - filename: dataset_policy_valid.hdf5
      seed: 1
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
    - filename: dataset_policy_noisy_valid.hdf5
      seed: 3
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
      policy_action_noise_std: 0.1
    - filename: dataset_zero_action_valid.hdf5
      seed: 2
      split: valid
      task_kind: default
      zero_actions: true
      use_policy: false
