workflow:
  base_name: franka-reach-replay-smoke
  dataset_subdir: franka-reach-replay-smoke
  image: docker.io/rowany28070/isaac-lab-nerd:g1-develop

resources:
  num_gpu: 1
  num_cpu: 12
  memory: 64Gi
  storage: 64Gi
  platform: ovx-l40s

experiment:
  env_name: Franka-Reach
  robot_name: Franka
  data_gen_task: Isaac-Reach-Franka-Dataset-Gen-v0
  deployment_task: Isaac-Reach-Franka-Dataset-Gen-v0
  train_task: Isaac-Reach-Franka-NeRD-v0
  train_cfg: ./source/isaaclab_neural/isaaclab_neural/train/cfg/Franka/transformer_reach_policy.yaml
  train_preset: newton_mjwarp
  skip_training: true
  num_gpus: 1
  contact_mode: newton_native
  contact_representation: flat
  num_contacts_per_env: 0
  sample_mode: action
  initial_states_source: env
  action_hold_frames: 20
  states_frame: world
  train_transitions: 1600
  valid_transitions: 1600
  data_gen_num_envs: 16
  train_num_envs: 16
  trajectory_length: 100
  write_chunk_transitions: 1600
  update_dataset_statistics: false
  policy_checkpoint: ./pretrained/control_policy/franka_reach/model_999.pt
  dataset_specs:
    - filename: dataset_policy_replay.hdf5
      seed: 3
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
    - filename: dataset_random_replay.hdf5
      seed: 1
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: false
