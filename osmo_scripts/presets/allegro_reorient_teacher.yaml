# Allegro reorientation teacher: the core Isaac Lab RSL-RL configuration (8192 worlds,
# 24 steps per iteration, 5000 iterations) on the Newton-contact policy task, one GPU.
# RSL-RL uploads every saved checkpoint to the W&B project rl of the API key's default
# entity under run id allegro-<id>; submit with --enable-wandb, download
# the final model and stage it under pretrained/control_policy/allegro_reorient/ for
# allegro_reorient_mixed. The run directory and MJWarp baseline are also in the output.

workflow:
  base_name: allegro-reorient-teacher
  dataset_subdir: allegro-reorient-teacher
  image: docker.io/rowany28070/isaac-lab-nerd:so101-newton160-cu130-sdk095

resources:
  num_gpu: 1
  num_cpu: 12
  memory: 64Gi
  storage: 128Gi
  platform: ovx-l40

experiment:
  teacher_only: true
  teacher_policy:
    task: Isaac-Reorient-Cube-Allegro-Policy-v0
    experiment_name: allegro_reorient_teacher
    num_gpus: 1
    seed: 42
    wandb_project: rl
    wandb_run_id_prefix: allegro
    evaluation:
      module: isaaclab_neural.eval.allegro_reorient_policy
      num_envs: 256
      control_steps: 1500
      seed: 100
