# Two-GPU end-to-end check of anymal_flat_control_step at sizes that only exercise the pipeline. Uses its own
# dataset cache.

workflow:
  base_name: anymal-flat-control-step-smoke
  dataset_subdir: anymal-c-flat-control-step-smoke-v1
  image: docker.io/rowany28070/isaac-lab-nerd:so101-newton160-cu130-sdk095

resources:
  num_gpu: 2
  num_cpu: 24
  memory: 128Gi
  storage: 192Gi
  platform: ovx-l40s

experiment:
  dataset_dir: ./data/datasets/anymal-c-flat-control-step-v1
  env_name: Anymal-C-Flat-ControlStep
  robot_name: Anymal-C
  data_gen_task: Isaac-Velocity-Flat-Anymal-C-ControlStep-Dataset-Gen-v0
  deployment_task: Isaac-Velocity-Flat-Anymal-C-ControlStep-Dataset-Gen-v0
  # Graph-enabled twin of the recording task: teacher runner config, native evaluation and baselines.
  policy_task: Isaac-Velocity-Flat-Anymal-C-Policy-v0
  train_task: Isaac-Velocity-Flat-Anymal-C-ControlStep-NeRD-v0
  train_cfg: ./source/isaaclab_neural/isaaclab_neural/train/cfg/Anymal/transformer_flat_control_step.yaml
  train_preset: newton_mjwarp
  num_gpus: 2
  contact_mode: newton_native
  contact_representation: contact_tokens
  num_contacts_per_env: 64
  max_contact_tokens: 64
  contact_packing_policy: body_round_robin_pair_atomic
  contact_filter: solver_active_movable
  dataset_collector: env_driven
  record_control_steps: true
  collection_chunk_control_steps: 64
  sample_mode: action
  initial_states_source: env
  states_frame: body
  train_transitions: 30000
  valid_transitions: 8000
  data_gen_num_envs: 256
  train_num_envs: 64
  # Clips of 32 control steps.
  trajectory_length: 32
  # Small shards queued over two collection GPUs.
  parallel_collection_gpus: 2
  no_time_stamp: true
  headless: true
  update_dataset_statistics: true
  eval_interval: 1
  save_interval: 1
  train_cfg_overrides: algorithm.num_epochs 2 algorithm.num_iters_per_epoch 20 algorithm.num_valid_batches 4 algorithm.dataset.valid_max_capacity 30000 algorithm.eval.control_steps 200
  policy_checkpoint: ./pretrained/control_policy/anymal_c_flat_terrain/model_299.pt
  require_packaged_policy: true
  policy_evaluation:
    module: isaaclab_neural.eval.policy_rollout
    num_envs: 64
    control_steps: 300
    seed: 100
    args: [--task, Isaac-Velocity-Flat-Anymal-C-Policy-v0, --metric, velocity_tracking_error]
    # The native metric becomes the closed-loop checkpoint-selection reference during training.
    reference:
      metric: velocity_tracking_error
      cfg_key: algorithm.eval.selection.reference
  throughput_benchmark:
    module: isaaclab_neural.eval.task_benchmark
    checkpoint_name: best_eval_model.pt
    num_envs: [256]
    warmup: 10
    steps: 50
    breakdown_steps: 10
    profile_steps: 5
    model_autocast: [fp16]
    # Primary-body count is approximate; it only sizes the synthetic contact inputs of the model-only timing.
    model_args: [--num-bodies, 17, --frames-per-control-step, 4]
    env_args: [--task, Isaac-Velocity-Flat-Anymal-C-Policy-v0, --nerd-task, Isaac-Velocity-Flat-Anymal-C-ControlStep-NeRD-v0]
    variants:
      - name: mjwarp_newton_contacts
      # reset_history episode_start requires the frame cache, so the baseline keeps it.
      - name: nerd_fp32_eager
        nerd: true
        args: [--inference-precision, fp32, --no-inference-compile]
      - name: nerd_optimized
        nerd: true
  dataset_specs:
    - filename: dataset_policy_a_train.hdf5
      seed: 0
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      num_transitions: 30000
    - filename: dataset_policy_b_train.hdf5
      seed: 30
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      num_transitions: 30000
    - filename: dataset_policy_noisy_train.hdf5
      seed: 10
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      policy_action_noise_std: 0.2
      num_transitions: 30000
    - filename: dataset_random_action_train.hdf5
      seed: 40
      split: train
      task_kind: default
      zero_actions: false
      use_policy: false
      num_transitions: 30000
    - filename: dataset_zero_action_train.hdf5
      seed: 20
      split: train
      task_kind: default
      zero_actions: true
      use_policy: false
      num_transitions: 30000
    - filename: dataset_policy_valid.hdf5
      seed: 1
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
    - filename: dataset_policy_noisy_valid.hdf5
      seed: 3
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
      policy_action_noise_std: 0.2
    - filename: dataset_random_action_valid.hdf5
      seed: 4
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: false
    - filename: dataset_zero_action_valid.hdf5
      seed: 2
      split: valid
      task_kind: default
      zero_actions: true
      use_policy: false
