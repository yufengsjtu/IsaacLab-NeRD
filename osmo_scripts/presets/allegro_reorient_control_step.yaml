# SO101-style control-step Allegro NeRD with the packaged allegro_reorient_teacher checkpoint:
# the env-driven collector records reset-safe 32-control-step clips with a recording contract
# on eight GPUs; training uses unique-transition sliding windows, GPU-resident data, FP16
# autocast and closed-loop evaluation, followed by the throughput benchmarks.

workflow:
  base_name: allegro-reorient-control-step
  dataset_subdir: allegro-reorient-control-step-v1
  image: docker.io/rowany28070/isaac-lab-nerd:so101-newton160-cu130-sdk095

resources:
  num_gpu: 8
  num_cpu: 80
  memory: 512Gi
  storage: 512Gi
  platform: ovx-l40

experiment:
  dataset_dir: ./data/datasets/allegro-reorient-control-step-v1
  env_name: Allegro-Reorient
  robot_name: Allegro-Reorient
  data_gen_task: Isaac-Reorient-Cube-Allegro-Policy-v0
  deployment_task: Isaac-Reorient-Cube-Allegro-Policy-v0
  train_task: Isaac-Reorient-Cube-Allegro-NeRD-v0
  train_cfg: ./source/isaaclab_neural/isaaclab_neural/train/cfg/Allegro/transformer_reorient_control_step.yaml
  train_preset: newton_mjwarp
  num_gpus: 8
  contact_mode: newton_native
  contact_representation: contact_tokens
  num_contacts_per_env: 128
  max_contact_tokens: 128
  contact_packing_policy: body_round_robin_pair_atomic
  contact_filter: solver_active_movable
  dataset_collector: allegro_reorient
  record_control_steps: true
  collection_chunk_control_steps: 64
  sample_mode: action
  initial_states_source: env
  states_frame: body
  train_transitions: 6000000
  valid_transitions: 333334
  data_gen_num_envs: 1024
  train_num_envs: 256
  # Clips of 32 control steps (1.07 s).
  trajectory_length: 32
  # Eight dataset shards collected concurrently, one GPU each.
  parallel_collection_gpus: 8
  no_time_stamp: true
  headless: true
  update_dataset_statistics: true
  eval_interval: 5
  policy_checkpoint: ./pretrained/control_policy/allegro_reorient/model_4999.pt
  require_packaged_policy: true
  policy_evaluation:
    module: isaaclab_neural.eval.allegro_reorient_policy
    num_envs: 256
    control_steps: 1500
    seed: 100
    min_mean_goals_per_episode: 2.0
  throughput_benchmark:
    module: isaaclab_neural.eval.allegro_benchmark
    checkpoint_name: best_eval_model.pt
    num_envs: [1024, 8192]
    model_autocast: [fp32, fp16]
    variants:
      - name: mjwarp_newton_contacts
      - name: mjwarp_mujoco_contacts
        args: [--mujoco-contacts]
      - name: nerd_fp32_eager
        nerd: true
        args: [--inference-precision, fp32, --no-inference-compile, --no-frame-cache]
      - name: nerd_optimized
        nerd: true
  dataset_specs:
    - filename: dataset_policy_a_train.hdf5
      seed: 0
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      num_transitions: 1200000
    - filename: dataset_policy_b_train.hdf5
      seed: 30
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      num_transitions: 1200000
    - filename: dataset_policy_c_train.hdf5
      seed: 40
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      num_transitions: 1200000
    - filename: dataset_policy_noisy_train.hdf5
      seed: 10
      split: train
      task_kind: default
      zero_actions: false
      use_policy: true
      policy_action_noise_std: 0.1
      num_transitions: 1200000
    - filename: dataset_zero_action_train.hdf5
      seed: 20
      split: train
      task_kind: default
      zero_actions: true
      use_policy: false
      num_transitions: 1200000
    - filename: dataset_policy_valid.hdf5
      seed: 1
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
    - filename: dataset_policy_noisy_valid.hdf5
      seed: 3
      split: valid
      task_kind: default
      zero_actions: false
      use_policy: true
      policy_action_noise_std: 0.1
    - filename: dataset_zero_action_valid.hdf5
      seed: 2
      split: valid
      task_kind: default
      zero_actions: true
      use_policy: false
